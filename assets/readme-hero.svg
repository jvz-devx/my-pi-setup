<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">My Pi setup terminal preview</title>
  <desc id="desc">A clean terminal-style preview showing configuration details for a personal Pi setup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B10"/>
      <stop offset="0.55" stop-color="#0B111A"/>
      <stop offset="1" stop-color="#070B10"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="70" x2="1080" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1724"/>
      <stop offset="1" stop-color="#0A1018"/>
    </linearGradient>
    <filter id="shadow" x="75" y="33" width="1050" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #778498; }
      .text { fill: #D9E3EE; }
      .green { fill: #82F7C5; }
      .cyan { fill: #5EEAD4; }
      .amber { fill: #F8C471; }
      .purple { fill: #B7A5FF; }
      .line { stroke: #1D2A3A; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <circle cx="1028" cy="102" r="180" fill="#0F766E" opacity="0.07"/>
  <circle cx="170" cy="486" r="210" fill="#7C3AED" opacity="0.055"/>

  <g filter="url(#shadow)">
    <rect x="120" y="70" width="960" height="420" rx="20" fill="url(#panel)" stroke="#243244"/>
    <rect x="120" y="70" width="960" height="52" rx="20" fill="#111B28"/>
    <path d="M120 102C120 84.3269 134.327 70 152 70H1048C1065.67 70 1080 84.3269 1080 102V122H120V102Z" fill="#111B28"/>
    <circle cx="154" cy="96" r="7" fill="#FF5F57"/>
    <circle cx="178" cy="96" r="7" fill="#FFBD2E"/>
    <circle cx="202" cy="96" r="7" fill="#28C840"/>
    <text x="600" y="101" text-anchor="middle" class="mono muted" font-size="15">~/.pi/agent — my-pi-setup</text>
  </g>

  <g class="mono" font-size="18">
    <text x="164" y="166"><tspan class="green">jens</tspan><tspan class="muted">@pi</tspan><tspan class="text">:</tspan><tspan class="cyan">~/.pi/agent</tspan><tspan class="text">$ </tspan><tspan class="text">pi setup --preview</tspan></text>
    <rect x="164" y="190" width="872" height="1" fill="#223043"/>

    <text x="164" y="232" class="muted">project</text>
    <text x="292" y="232" class="text">My Pi setup</text>
    <text x="560" y="232" class="muted">theme</text>
    <text x="670" y="232" class="text">dark</text>
    <text x="800" y="232" class="muted">steering</text>
    <text x="934" y="232" class="text">all</text>

    <text x="164" y="270" class="muted">provider</text>
    <text x="292" y="270" class="cyan">openai-codex</text>
    <text x="560" y="270" class="muted">model</text>
    <text x="670" y="270" class="cyan">gpt-5.5</text>
    <text x="800" y="270" class="muted">thinking</text>
    <text x="934" y="270" class="cyan">medium</text>

    <text x="164" y="326" class="amber">packages</text>
    <text x="292" y="326" class="text">pi-goal</text>
    <text x="432" y="326" class="text">pi-subagents</text>
    <text x="612" y="326" class="text">pi-phone</text>
    <text x="744" y="326" class="text">pi-memory</text>
    <text x="884" y="326" class="text">image-gen</text>

    <text x="164" y="382" class="green">restore</text>
    <text x="292" y="382" class="text">git clone github.com/jvz-devx/my-pi-setup ~/.pi/agent</text>
    <text x="292" y="418" class="text">pi update --extensions</text>

    <text x="164" y="462"><tspan class="green">✓</tspan><tspan class="text"> personal configuration synced</tspan><tspan class="muted">  •  secrets and runtime state ignored</tspan></text>
  </g>

  <g opacity="0.7">
    <rect x="150" y="140" width="900" height="328" rx="12" stroke="#162337"/>
    <path d="M250 350H1032" class="line"/>
  </g>
</svg>
